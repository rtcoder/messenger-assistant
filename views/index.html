<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Assistant</title>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: Arial, sans-serif;
          background: linear-gradient(90deg, #007BFF, #00BFFF);
          background-size: 400% 400%;
          animation: gradient 15s infinite;
          text-align: center;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          height: 100dvh;
      }

      @keyframes gradient {
          0% {
              background-position: 0 50%;
          }
          50% {
              background-position: 100% 50%;
          }
          100% {
              background-position: 0 50%;
          }
      }

      h1 {
          font-size: 3em;
          margin-bottom: 20px;
          color: #fff;
      }

      a {
          color: #ff0;
          text-decoration: none;
      }
  </style>
</head>
<body>
<h1>Messenger Assistant</h1>
<a href="https://github.com/rtcoder/messenger-assistant">GitHub</a>
</body>
</html>
