name: Test and audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: php -l public/index.php
      - run: npm audit --omit=dev --audit-level=low
